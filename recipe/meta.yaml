{% set name = "orthority" %}
{% set version = "0.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/orthority-{{ version }}.tar.gz
  sha256: 72fbea3ba31a75956ea03ae2c47413109ea8df826449eecae19b52219761825c

build:
  entry_points:
    - oty = orthority.cli:cli
    - simple-ortho = orthority.cli:simple_ortho
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - rasterio >=1.3.6
    - opencv >=4.8,<5
    - pyyaml >=5
    - click >=8.3
    - tqdm >=4
    - fsspec >=2023.12
    - threadpoolctl >=3.6

test:
  imports:
    - orthority
  commands:
    - pip check
    - oty --help
  requires:
    - pip
    - libopencv * headless*  # [linux]
    - python {{ python_min }}

about:
  summary: Orthorectification of drone, aerial and satellite imagery.
  license: AGPL-3.0-or-later
  license_file: LICENSE
  home: https://github.com/leftfield-geospatial/orthority
  doc_url: https://orthority.readthedocs.io

extra:
  recipe-maintainers:
    - dugalh
